name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run engine tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Cross-compile Windows build with MinGW (compile check)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mingw-w64
          cmake -S . -B build-mingw -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -A ${{ matrix.arch }}
          cmake --build build --config Release --target StarField
      - name: Smoke test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./windows/smoke.ps1 -Scr build/Release/StarField.scr -OutDir screenshots
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/StarField.scr, windows/install.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: StarField-windows-${{ matrix.arch }}
          path: dist/
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64' && always()
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build StarField.saver
        run: STARFIELD_VERSION="${TAG#v}" ./macos/build.sh
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
      - name: Check bundle
        run: |
          file build/macos/StarField.saver/Contents/MacOS/StarField
          codesign --verify --verbose build/macos/StarField.saver
      - name: Smoke test
        run: |
          clang -fobjc-arc -O2 macos/harness.m -framework Cocoa -framework ScreenSaver -o build/macos/harness
          build/macos/harness build/macos/StarField.saver screenshots
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/StarField.saver dist/StarField-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StarField-macos
          path: dist/StarField-macOS.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: screenshots/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [engine-tests, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          mkdir release
          cp artifacts/StarField-macos/StarField-macOS.zip release/
          for arch in x64 ARM64; do
            (cd "artifacts/StarField-windows-$arch" && zip -q "../../release/StarField-Windows-$arch.zip" StarField.scr install.ps1)
          done
          ls -la release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" --title "StarField ${{ github.ref_name }}" --generate-notes
